{% extends 'base.html' %}
{% block content %}
<h2>Новый сотрудник — {{ project.name }}</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Полное имя</label>
    <input class="form-control" name="full_name" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Код терминала (employeeCode)</label>
    <input class="form-control" name="device_code" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Telegram @username (необязательно)</label>
    <input class="form-control" name="telegram_handle">
  </div>
  <button class="btn btn-success" type="submit">Сохранить</button>
  <a class="btn btn-link" href="{{ url_for('employees', project_id=project.id) }}">Отмена</a>
</form>
{% endblock %}
